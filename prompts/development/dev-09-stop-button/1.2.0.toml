id = "dev-09-stop-button"
version = "1.2.0"
title = "Add a Stop button for long-running jobs"
kind = "development"
status = "implemented"
date = "2026-10-09"
purpose = "Let users stop a generation run that is taking too long."
outcome = "A Stop button appears after 30 seconds, with confirmation; cancelling interrupts in-flight requests and retry waits, and completed steps stay cached for the next run."
changes = "Light edit of the 1.1.0 rewrite: tightened the wording; a cancelled queued job must never start."

template = '''
Allow users to stop a generation run that is taking too long.

- Show a Stop button on the progress screen once a run has been active for 30 seconds.
- Ask for confirmation before stopping.
- Stop promptly, including while waiting for a model reply or a retry back-off, and free the server for the next job.
- Show the run as stopped rather than failed, and offer to run it again, reusing every step that already completed.
- Cancelling a queued job must prevent it from starting.'''

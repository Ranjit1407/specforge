id = "dev-11-huggingface-kimi-provider"
version = "1.0.0"
title = "Use Kimi-K3 through the Hugging Face router"
kind = "development"
status = "reverted"
date = "2026-10-07"
purpose = "Call models through the Hugging Face Inference Providers router, using Kimi-K3 on Together."
outcome = "A configurable provider setting (LLM_PROVIDER) with Kimi-K3 on Together was added, then reverted in dev-12 because the model is paid."
changes = "Original request as written."

template = '''
use this

import os
from openai import OpenAI

client = OpenAI(
    base_url="https://router.huggingface.co/v1",
    api_key=os.environ["HF_TOKEN"],
)

completion = client.chat.completions.create(
    model="moonshotai/Kimi-K3:together",
    messages=[
        {
            "role": "user",
            "content": [
                {
                    "type": "text",
                    "text": "Describe this image in one sentence."
                },
                {
                    "type": "image_url",
                    "image_url": {
                        "url": "https://cdn.britannica.com/61/93061-050-99147DCE/Statue-of-Liberty-Island-New-York-Bay.jpg"
                    }
                }
            ]
        }
    ],
)

print(completion.choices[0].message)'''
